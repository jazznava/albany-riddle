<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Misión: Tu Cumpleaños</title>
<style>
  :root {
    --bg: #0e1a2b;
    --fg: #f3e3b8;
    --accent: #e0a526;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--fg);
    font-family: Georgia, "Times New Roman", serif;
    text-align: center;
  }
  main { padding: 16px; width: 100%; max-width: 720px; }
  h1 { margin: 0 0 8px; font-size: 1.6rem; }
  p { margin: 0 0 24px; opacity: .85; }
  #countdown {
    display: flex;
    justify-content: center;
    gap: 12px;
  }
  .unit {
    min-width: 72px;
    padding: 14px 8px;
    border: 2px solid var(--accent);
    border-radius: 10px;
    background: rgba(255,255,255,.05);
  }
  .unit b { display: block; font-size: 2rem; color: var(--accent); }
  .unit span { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; }
  img { display: block; width: 100%; height: auto; border-radius: 8px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <section id="locked">
    <h1>🏴‍☠️ Una aventura te espera…</h1>
    <p>El mapa del tesoro se revelará mañana a las 8:00 am.</p>
    <div id="countdown" aria-live="polite">
      <div class="unit"><b id="h">--</b><span>horas</span></div>
      <div class="unit"><b id="m">--</b><span>min</span></div>
      <div class="unit"><b id="s">--</b><span>seg</span></div>
    </div>
    <form id="keyForm" style="margin-top:32px">
      <input id="key" type="password" placeholder="Clave" autocomplete="off"
        style="padding:8px 10px;border-radius:6px;border:1px solid var(--accent);background:transparent;color:var(--fg)">
      <button style="padding:8px 12px;border-radius:6px;border:0;background:var(--accent);color:#000;cursor:pointer">Abrir</button>
      <div id="keyMsg" style="margin-top:8px;font-size:.85rem;min-height:1.2em"></div>
    </form>
  </section>
  <section id="revealed" hidden></section>
</main>
<script>
  // Fecha de apertura: 23 de octubre de 2026, 8:00 am (hora local del visitante)
  var OPEN_AT = new Date(2026, 9, 23, 8, 0, 0);
  var locked = document.getElementById('locked');
  var revealed = document.getElementById('revealed');
  var timer;

  function pad(n) { return String(n).padStart(2, '0'); }

  function reveal() {
    clearInterval(timer);
    // La imagen solo se pide al navegador cuando ya es la hora
    var img = new Image();
    img.src = 'images/riddle-brithday.jpeg';
    img.alt = 'Misión: Tu cumpleaños — una aventura pirata con un gran tesoro';
    revealed.appendChild(img);
    locked.hidden = true;
    revealed.hidden = false;
  }

  function tick() {
    var diff = OPEN_AT - new Date();
    if (diff <= 0) { reveal(); return; }
    var total = Math.floor(diff / 1000);
    document.getElementById('h').textContent = pad(Math.floor(total / 3600));
    document.getElementById('m').textContent = pad(Math.floor(total % 3600 / 60));
    document.getElementById('s').textContent = pad(total % 60);
  }

  // Clave de vista previa (se guarda solo su hash SHA-256)
  var KEY_HASH = '96e72f196d39d41090957950968b0e41185cb01266c181fbc64087e5662c8b90';
  document.getElementById('keyForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var msg = document.getElementById('keyMsg');
    var value = document.getElementById('key').value;
    if (!window.crypto || !crypto.subtle) { msg.textContent = 'Navegador no compatible.'; return; }
    crypto.subtle.digest('SHA-256', new TextEncoder().encode(value)).then(function (buf) {
      var hex = Array.from(new Uint8Array(buf)).map(function (b) { return pad(b.toString(16)); }).join('');
      if (hex === KEY_HASH) reveal(); else msg.textContent = 'Clave incorrecta.';
    });
  });

  tick();
  timer = setInterval(tick, 1000);
</script>
</body>
</html>
